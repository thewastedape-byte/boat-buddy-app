name: Build Android AAB (v5.2)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export
        run: npm run build
        env:
          CAPACITOR_BUILD: 'true'

      - name: Create Android assets directory
        run: mkdir -p android/app/src/main/assets

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set Android SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release AAB
        run: cd android && ./gradlew bundleRelease --no-daemon

      - name: Sign AAB with release keystore
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore android/app/signing.keystore \
            -storepass 0ISDe8KPVRqD \
            -keypass 0ISDe8KPVRqD \
            android/app/build/outputs/bundle/release/app-release.aab \
            my-key-alias

      - name: Upload signed v5.2 AAB
        uses: actions/upload-artifact@v4
        with:
          name: boat-buddy-v52-signed-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
